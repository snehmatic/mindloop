{{ define "content" }}
<div class="card">
    <h2>New Entry</h2>
    <form action="/journal/new" method="POST">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required placeholder="Title your thoughts...">
        </div>
        <div class="form-group">
            <label for="mood">Mood</label>
            <select id="mood" name="mood">
                <option value="neutral">Neutral 😐</option>
                <option value="happy">Happy 😊</option>
                <option value="sad">Sad 😔</option>
                <option value="energetic">Energetic ⚡</option>
                <option value="calm">Calm 😌</option>
            </select>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="4" required
                placeholder="Write your daily reflection here..."></textarea>
        </div>
        <div class="flex-center" style="justify-content: flex-end;">
            <button type="submit" class="btn btn-primary" style="padding-left: 2rem; padding-right: 2rem;">Save
                Entry</button>
        </div>
    </form>
</div>

<div class="entries" style="margin-top: 2rem;">
    <div class="flex-between mobile-stack mb-md">
        <h2 class="mb-0">Recent Entries</h2>
        <form action="/cleanslate" method="POST" onsubmit="return confirm('Delete all journal entries?');" class="mb-0">
            <input type="hidden" name="type" value="journal">
            <button type="submit" class="btn btn-premium-outline btn-sm">Reset Journal</button>
        </form>
    </div>
    {{ if .Entries }}
    {{ range .Entries }}
    <div class="card">
        <div class="flex-between">
            <h3>{{ .Title }} <small class="text-muted font-normal">({{ .Mood }})</small></h3>
            <form action="/journal/delete" method="POST" style="margin: 0;"
                onsubmit="return confirm('Delete this entry?');">
                <input type="hidden" name="id" value="{{ .ID }}">
                <button type="submit" class="btn btn-danger-outline btn-sm" title="Delete">🗑️</button>
            </form>
            <button onclick="toggleEditJournal('{{ .ID }}')" class="btn btn-secondary btn-sm" title="Edit">✏️</button>
        </div>
        <div id="display-journal-{{ .ID }}">
            <p>{{ .Content }}</p>
            <small class="text-muted">{{ .CreatedAt.Format "Jan 02, 2006 15:04" }}</small>
        </div>

        <!-- Edit Form -->
        <div id="edit-journal-{{ .ID }}" style="display: none; margin-top: 1rem;">
            <form action="/journal/update" method="POST">
                <input type="hidden" name="id" value="{{ .ID }}">
                <div class="form-group">
                    <input type="text" name="title" value="{{ .Title }}" required>
                </div>
                <div class="form-group">
                    <select name="mood">
                        <option value="neutral" {{ if eq .Mood "neutral" }}selected{{ end }}>Neutral 😐</option>
                        <option value="happy" {{ if eq .Mood "happy" }}selected{{ end }}>Happy 😊</option>
                        <option value="sad" {{ if eq .Mood "sad" }}selected{{ end }}>Sad 😔</option>
                        <option value="energetic" {{ if eq .Mood "energetic" }}selected{{ end }}>Energetic ⚡</option>
                        <option value="calm" {{ if eq .Mood "calm" }}selected{{ end }}>Calm 😌</option>
                    </select>
                </div>
                <div class="form-group">
                    <textarea name="content" rows="4" required>{{ .Content }}</textarea>
                </div>
                <div class="flex-between">
                    <button type="button" class="btn btn-sm btn-secondary" onclick="toggleEditJournal('{{ .ID }}')">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    {{ end }}
    {{ else }}
    <div class="card">
        <p>No entries found. Start journaling!</p>
    </div>
    {{ end }}
</div>

<script>
    function toggleEditJournal(id) {
        const display = document.getElementById('display-journal-' + id);
        const form = document.getElementById('edit-journal-' + id);
        if (form.style.display === 'none') {
            form.style.display = 'block';
            display.style.display = 'none';
        } else {
            form.style.display = 'none';
            display.style.display = 'block';
        }
    }
</script>
{{ end }}
