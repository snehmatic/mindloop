<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Mindloop</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon_io/favicon.ico">
    <link rel="stylesheet" href='{{ asset "/static/css/style.css" }}'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/static/js/lucide.min.js"></script>
    <script>
        // Check for saved user preference early to prevent flash
        (function () {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme) {
                document.documentElement.classList.add(currentTheme);
            }
        })();
    </script>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <i data-lucide="infinity"></i>
                    Mindloop
                </a>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link" title="Home"><i data-lucide="home"></i> <span
                                class="nav-text">Home</span></a></li>
                    <li><a href="/intent" class="nav-link" title="Intent"><i data-lucide="crosshair"></i> <span
                                class="nav-text">Intent</span></a></li>
                    <li><a href="/habits" class="nav-link" title="Habits"><i data-lucide="check-square"></i> <span
                                class="nav-text">Habits</span></a></li>
                    <li><a href="/focus" class="nav-link" title="Focus"><i data-lucide="zap"></i> <span
                                class="nav-text">Focus</span></a></li>

                    <!-- Write Dropdown -->
                    <li class="dropdown" id="write-dropdown">
                        <a href="#" class="nav-link" onclick="toggleWriteDropdown(event)" title="Write">
                            <i data-lucide="pen-tool"></i> <span class="nav-text">Write</span> <i
                                data-lucide="chevron-down" style="width: 0.8em; height: 0.8em; opacity: 0.7;"></i>
                        </a>
                        <div class="dropdown-content">
                            <a href="/journal" class="dropdown-item"><i data-lucide="book"></i> Journal</a>
                            <a href="/notes" class="dropdown-item"><i data-lucide="file-text"></i> Notes</a>
                        </div>
                    </li>

                    <li><a href="/summary" class="nav-link" title="Summary"><i data-lucide="bar-chart-2"></i> <span
                                class="nav-text">Summary</span></a></li>
                    <li><a href="/void" class="nav-link" title="The Void"><i data-lucide="ghost"></i> <span
                                class="nav-text">Void</span></a></li>

                    <!-- Icon-only items -->
                    <li><a href="/about" class="nav-link" title="About"><i data-lucide="info"></i></a></li>
                    <li><a href="/settings" class="nav-link" title="Settings"><i data-lucide="settings"></i></a></li>

                    <li><button id="theme-toggle" class="btn btn-sm btn-secondary">
                        <i data-lucide="moon" class="icon-moon" style="width: 1.1em; height: 1.1em;"></i>
                        <i data-lucide="sun" class="icon-sun" style="width: 1.1em; height: 1.1em; display: none;"></i>
                    </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        {{ if .SuccessMessage }}
        <div class="card mb-md animate-fade-in"
            style="background-color: var(--success-bg); border-color: var(--success); color: var(--success);">
            <div style="font-weight: 500;">{{ .SuccessMessage }}</div>
        </div>
        <script>
            if (String("{{ .SuccessMessage }}").toLowerCase().includes("done") || String("{{ .SuccessMessage }}").toLowerCase().includes("complet") || String("{{ .SuccessMessage }}").toLowerCase().includes("log") || String("{{ .SuccessMessage }}").toLowerCase().includes("end")) {
                setTimeout(() => confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }), 100);
            }
        </script>
        {{ end }}
        {{ if .ErrorMessage }}
        <div class="card mb-md animate-fade-in"
            style="background-color: var(--danger-bg); border-color: var(--danger); color: var(--danger);">
            <div style="font-weight: 500;">{{ .ErrorMessage }}</div>
        </div>
        {{ end }}

        <!-- Placeholder for HTMX OOB Toasts -->
        <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 100;"></div>

        {{ template "content" . }}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Re-run icons on HTMX content swaps
            document.body.addEventListener('htmx:afterSwap', function (evt) {
                // We scan the whole body to be safe, as some swaps might replace containers
                lucide.createIcons();
                
                // Trigger confetti on successful swaps that indicate completion
                if (evt.detail.xhr.status >= 200 && evt.detail.xhr.status < 300) {
                    const responseText = evt.detail.xhr.responseText.toLowerCase();
                    if (responseText.includes('success') && (responseText.includes('done') || responseText.includes('complet') || responseText.includes('log') || responseText.includes('end'))) {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }
                }
            });

            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            const moonIcon = document.querySelector('.icon-moon');
            const sunIcon = document.querySelector('.icon-sun');

            function updateIcons(isDark) {
                // We need to re-query because lucide might have replaced <i> with <svg>
                // But the class names should be preserved on the new SVGs
                const moon = document.querySelector('.icon-moon');
                const sun = document.querySelector('.icon-sun');
                
                if (isDark) {
                    if(moon) moon.style.display = 'none';
                    if(sun) sun.style.display = 'block';
                } else {
                    if(moon) moon.style.display = 'block';
                    if(sun) sun.style.display = 'none';
                }
            }

            // Sync icon on load
            if (html.classList.contains('dark-mode')) {
                updateIcons(true);
            } else {
                updateIcons(false);
            }

            themeToggle.addEventListener('click', function () {
                html.classList.toggle('dark-mode');
                let isDark = html.classList.contains('dark-mode');
                
                if (isDark) {
                    html.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark-mode');
                } else {
                    html.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                }
                
                updateIcons(isDark);
            });
        });

        function toggleWriteDropdown(e) {
            e.preventDefault();
            e.stopPropagation();
            const d = document.getElementById('write-dropdown');
            d.classList.toggle('active');
        }

        // Close dropdowns
        window.addEventListener('click', function (e) {
            if (!e.target.closest('#write-dropdown')) {
                document.getElementById('write-dropdown').classList.remove('active');
            }
        });
    </script>
</body>

</html>
