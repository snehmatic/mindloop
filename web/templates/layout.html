<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Mindloop</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="/static/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo" style="text-decoration: none;">
                    <span
                        style="background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Mindloop</span>
                </a>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Home</a></li>
                    <li><a href="/intent" class="nav-link">Intent</a></li>
                    <li><a href="/habits" class="nav-link">Habits</a></li>
                    <li><a href="/focus" class="nav-link">Focus</a></li>
                    <li><a href="/journal" class="nav-link">Journal</a></li>
                    <li><a href="/summary" class="nav-link">Summary</a></li>
                    <li><a href="/about" class="nav-link">About</a></li>
                    <li><button id="theme-toggle" class="btn btn-sm btn-secondary"
                            style="padding: 0.4rem 0.6rem;">🌙</button></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        {{ if .SuccessMessage }}
        <div class="card mb-md" style="border-left: 4px solid var(--success); background: #f0fdf4;">
            <div style="color: #166534; font-weight: 500;">{{ .SuccessMessage }}</div>
        </div>
        {{ end }}
        {{ if .ErrorMessage }}
        <div class="card mb-md" style="border-left: 4px solid var(--danger); background: #fef2f2;">
            <div style="color: #991b1b; font-weight: 500;">{{ .ErrorMessage }}</div>
        </div>
        {{ end }}
        {{ template "content" . }}
    </main>


    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = themeToggle;

        // Check for saved user preference, if any, on load of the website
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            body.classList.add(currentTheme);
            if (currentTheme === 'dark-mode') {
                icon.textContent = '☀️';
            }
        }

        themeToggle.addEventListener('click', function () {
            body.classList.toggle('dark-mode');
            let theme = 'light';
            if (body.classList.contains('dark-mode')) {
                theme = 'dark-mode';
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
            localStorage.setItem('theme', theme);
        });
    </script>
</body>

</html>
