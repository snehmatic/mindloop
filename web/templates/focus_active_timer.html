<div id="active-timer-container" class="card text-center"
    style="position: relative; overflow: hidden; padding: 4rem 2rem;">
    <!-- Ambient Glow Background -->
    <div
        style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; background: var(--primary); opacity: 0.05; filter: blur(80px); border-radius: 50%; pointer-events: none;">
    </div>

    <div style="position: relative; z-index: 1;">
        {{ $activeSession := "" }}
        {{ range .Sessions }}
        {{ if eq .Status "active" }}
        {{ $activeSession = . }}
        {{ end }}
        {{ end }}

        {{ if $activeSession }}
        <!-- Active Timer UI -->
        <div class="text-sm font-bold text-primary mb-md" style="text-transform: uppercase; letter-spacing: 0.1em;">
            Focusing</div>
        <h2 class="mb-lg">{{ $activeSession.Title }}</h2>

        <div class="mb-lg">
            <!-- Timer Display -->
            <div id="timer-display"
                style="font-size: 5rem; font-weight: 800; font-family: monospace; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -2px; color: var(--text-main);">
                00:00:00
            </div>
        </div>

        <form hx-post="/focus/stop" hx-target="#focus-view" class="mt-lg">
            <input type="hidden" name="id" value="{{ $activeSession.ID }}">
            <button type="submit" class="btn btn-danger-outline btn-lg">
                Stop Session
            </button>
        </form>

        <script>
            (function () {
                const startTime = new Date("{{ $activeSession.CreatedAt | iso8601 }}").getTime();
                const timerDisplay = document.getElementById('timer-display');
                if (!timerDisplay) return;

                function updateTimer() {
                    const now = new Date().getTime();
                    const diff = now - startTime;

                    if (diff < 0) return;

                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                    timerDisplay.innerText =
                        (hours < 10 ? "0" + hours : hours) + ":" +
                        (minutes < 10 ? "0" + minutes : minutes) + ":" +
                        (seconds < 10 ? "0" + seconds : seconds);
                }

                if (window.focusTimerInterval) clearInterval(window.focusTimerInterval);
                window.focusTimerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            })();
        </script>
        {{ else }}
        <!-- Start Form -->
        <h1 class="hero-title mb-md">Focus</h1>
        <p class="text-lg mb-lg">Enter a flow state. Track deep work.</p>

        <form hx-post="/focus/start" hx-target="#focus-view" class="flex-center flex-col mt-lg">
            <div class="flex-center gap-sm" style="width: 100%; max-width: 450px;">
                <input type="text" name="title" placeholder="What are you working on?" required class="text-center">
                <button type="submit" class="btn btn-primary">Start</button>
            </div>
        </form>
        {{ end }}
    </div>
</div>
