<div id="active-timer-container" class="card text-center focus-timer-card">
    <div class="focus-timer-glow"></div>

    <div class="focus-timer-content">
        {{ $activeSession := "" }}
        {{ range .Sessions }}
            {{ if eq .Status "active" }}
                {{ $activeSession = . }}
            {{ end }}
        {{ end }}

        {{ if $activeSession }}
        <!-- Active Timer UI -->
        <h2 class="mb-sm" style="color: var(--primary);">Focusing...</h2>
        <p class="mb-lg">{{ $activeSession.Title }}</p>

        <div class="timer-display-wrapper mb-lg">
            <!-- Timer Display -->
            <div id="timer-display" class="timer-display">
                00:00:00
            </div>
        </div>

        <form hx-post="/focus/stop" hx-target="#focus-view" style="margin-top: 3rem;">
            <input type="hidden" name="id" value="{{ $activeSession.ID }}">
            <button type="submit" class="btn btn-danger-outline" style="padding: 0.75rem 2rem;">
                Stop Session
            </button>
        </form>

        <script>
            (function() {
                const startTime = new Date("{{ $activeSession.CreatedAt | iso8601 }}").getTime();
                const timerDisplay = document.getElementById('timer-display');
                if (!timerDisplay) return;

                function updateTimer() {
                    const now = new Date().getTime();
                    const diff = now - startTime;

                    if (diff < 0) return;

                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                    timerDisplay.innerText =
                        (hours < 10 ? "0" + hours : hours) + ":" +
                        (minutes < 10 ? "0" + minutes : minutes) + ":" +
                        (seconds < 10 ? "0" + seconds : seconds);
                }

                // Clear previous interval if any
                if (window.focusTimerInterval) clearInterval(window.focusTimerInterval);
                window.focusTimerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            })();
        </script>
        {{ else }}
        <!-- Start Form -->
        <h1 class="mb-md focus-title">Focus</h1>
        <p class="mb-lg">Enter a flow state. Track your deep work.</p>

        <form hx-post="/focus/start" hx-target="#focus-view" class="flex-center mb-md" style="margin-top: 2rem;">
            <div class="flex-center gap-sm" style="width: 100%; max-width: 500px;">
                <input type="text" name="title" placeholder="What are you working on?" required
                    style="flex: 1; text-align: center;">
                <button type="submit" class="btn btn-primary">Start Session</button>
            </div>
        </form>
        {{ end }}
    </div>
</div>
